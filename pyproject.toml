[project]
name = "lottery"
version = "2.4.0"
description = "Iterative magnitude pruning search for lottery tickets (Frankle & Carbin, 2019) in PyTorch"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Matthew Jones", email = "github@matthewtjones.co.uk" }]
keywords = ["pruning", "lottery-ticket-hypothesis", "sparsity", "pytorch"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
    "torch>=2.9",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Quantisation-aware training via torchao.
# torchao 0.18 imports torch APIs added in 2.10.
qat = ["torchao>=0.18", "torch>=2.10"]
# Dataset loaders used by the examples.
vision = ["torchvision>=0.24"]

[project.urls]
Repository = "https://github.com/matthewjones372/winning-ticket-search"
Paper = "https://arxiv.org/abs/1803.03635"

[dependency-groups]
dev = [
    "accelerate>=1.15.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.13",
    "ty==0.0.84",
    "types-tqdm>=4.70.0.20260906",
]
# Which PyTorch build uv installs, for working in this repo. These are groups, not extras,
# so they stay out of the published metadata: `pip install lottery` takes whatever torch
# the environment already has. Pick at most one: `uv sync --group cpu` or `--group cu130`.
cpu = ["torch>=2.9", "torchvision>=0.24"]
cu130 = ["torch>=2.9", "torchvision>=0.24"]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

# ---------------------------------------------------------------- uv

[tool.uv]
conflicts = [[{ group = "cpu" }, { group = "cu130" }]]

# The CPU index also serves macOS wheels. There are no CUDA builds for macOS, so `cu130`
# there falls back to the PyPI build (CPU and MPS) instead of failing to install.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-cu130", group = "cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-cu130", group = "cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

# ---------------------------------------------------------------- tooling

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PT", "N", "ANN", "TC"]
ignore = ["N812"] # `import torch.nn.functional as F` is idiomatic

[tool.ruff.lint.per-file-ignores]
# Tests are type-checked by ty from what they call; annotating every test and fixture
# would add noise without catching anything.
"tests/**" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--import-mode=importlib"]
filterwarnings = [
    "ignore::DeprecationWarning:torchao.*",
    "ignore::SyntaxWarning",
]

[tool.coverage.run]
source = ["lottery"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src", "examples", "tests"]

[tool.ty.rules]
# Every suppression must still be needed.
unused-ignore-comment = "error"
unused-type-ignore-comment = "error"

[tool.ty.terminal]
error-on-warning = true
